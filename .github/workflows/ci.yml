name: CI

on:
  push:
  pull_request:

permissions:
  contents: write  # the android job keeps the newest APK on the "android" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: |
          ./build/squatch-tests
          ./build/squatch-scene-tests

      - name: Scene screenshot
        run: ./build/squatch-pc --new --save /tmp/ci.sav --shot scene.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: scene.bmp

      - name: Balance report
        run: |
          ./build/squatch-harness --runs 50 | tee balance.txt
          {
            echo '### Adult forms by player (50 pets each)'
            echo '```'
            cat balance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (4" LCD board)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          set -o pipefail
          idf.py -C firmware build 2>&1 | tee lcd4b.log || {
            grep -E "error:|Error|undefined reference" lcd4b.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build firmware (1.8" AMOLED board)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          set -o pipefail
          out="$PWD/firmware/build-amoled18"
          mkdir -p "$out"
          idf.py -C firmware -B "$out" -D SDKCONFIG="$out/sdkconfig" \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.amoled18" build 2>&1 | tee amoled18.log || {
            # Surface compiler errors as annotations, so they show without opening the log.
            grep -E "error:|Error|undefined reference" amoled18.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch SDL
        run: ./android/fetch-sdl.sh

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SQUATCH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/squatch.keystore"
            echo "SQUATCH_KEYSTORE=$RUNNER_TEMP/squatch.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SQUATCH_KEYSTORE_B64 secret: this APK has a throwaway key and won't install over the last one"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SQUATCH_KEYSTORE_PASSWORD: ${{ secrets.SQUATCH_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            grep -E "error:|ERROR|FAILED|What went wrong" -A3 build.log | head -30 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk ../pocket-squatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-squatch-apk
          path: pocket-squatch.apk

      - name: Publish to the "android" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease \
            --title "Pocket Squatch for Android (latest build)" \
            --notes "The newest Android build from main. Download pocket-squatch.apk on your phone and open it to install."
          gh release upload android pocket-squatch.apk --clobber
