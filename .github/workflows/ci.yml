name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: ./build/squatch-tests

      - name: Balance report
        run: |
          ./build/squatch-harness --runs 50 | tee balance.txt
          {
            echo '### Adult forms by player (50 pets each)'
            echo '```'
            cat balance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
