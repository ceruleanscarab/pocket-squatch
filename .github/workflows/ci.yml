name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: |
          ./build/squatch-tests
          ./build/squatch-scene-tests

      - name: Scene screenshot
        run: ./build/squatch-pc --new --save /tmp/ci.sav --shot scene.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: scene.bmp

      - name: Balance report
        run: |
          ./build/squatch-harness --runs 50 | tee balance.txt
          {
            echo '### Adult forms by player (50 pets each)'
            echo '```'
            cat balance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
