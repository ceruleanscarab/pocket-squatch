name: CI

on:
  push:
  pull_request:

permissions:
  contents: write  # the android job keeps the newest APK on the "android" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: |
          ./build/squatch-tests
          ./build/squatch-scene-tests

      - name: Scene screenshot
        run: ./build/squatch-pc --new --save /tmp/ci.sav --shot scene.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: scene.bmp

      - name: Balance report
        run: |
          ./build/squatch-harness --runs 50 | tee balance.txt
          {
            echo '### Adult forms by player (50 pets each)'
            echo '```'
            cat balance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    env:
      SQUATCH_BUILD: ${{ github.run_number }}  # the version updates over the air compare
    steps:
      - uses: actions/checkout@v4

      # One build per edition and board, each named as the boards ask for it (ota.cpp):
      # squatch-lcd4b, squatch-amoled18, pony-amoled18 and pony-amoled175 (the round 1.75C). None has Wi-Fi or a town in it.
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          set -o pipefail
          mkdir -p firmware-out
          build() {  # name, extra defaults files
            local name=$1 extra=$2 out="$PWD/firmware/build-$1"
            mkdir -p "$out"
            idf.py -C firmware -B "$out" -D SDKCONFIG="$out/sdkconfig" \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults$extra" build 2>&1 | tee "$name.log" || {
              # Surface compiler errors as annotations, so they show without opening the log.
              grep -E "error:|Error|undefined reference" "$name.log" | head -20 | while read -r line; do echo "::error::$line"; done
              exit 1
            }
            cp "$out/pocket_squatch.bin" "firmware-out/$name.bin"
          }
          build squatch-lcd4b ""
          build squatch-amoled18 ";sdkconfig.amoled18"
          build pony-amoled18 ";sdkconfig.amoled18;sdkconfig.pony"
          build pony-amoled175 ";sdkconfig.amoled175;sdkconfig.pony"
          ls -l firmware-out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware-out/*.bin

  # The boards update themselves from the "firmware" release: keep it on the newest build
  # of the main branch.
  firmware-release:
    needs: [build, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-out
      - name: Publish to the "firmware" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firmware >/dev/null 2>&1 || gh release create firmware --prerelease \
            --title "Firmware (updates over the air)" \
            --notes "The newest build of each edition and board. The boards fetch these themselves; to flash one by hand use esptool at 0x20000 after a full idf.py flash."
          gh release upload firmware firmware-out/*.bin --clobber

  android:
    runs-on: ubuntu-latest
    env:
      # A Google Cloud service account's JSON key, allowed to release this app in the Play Console.
      # Without it the builds still go to the GitHub release, just not to Google Play.
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch SDL
        run: ./android/fetch-sdl.sh

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SQUATCH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/squatch.keystore"
            echo "SQUATCH_KEYSTORE=$RUNNER_TEMP/squatch.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SQUATCH_KEYSTORE_B64 secret: this APK has a throwaway key and won't install over the last one"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SQUATCH_KEYSTORE_PASSWORD: ${{ secrets.SQUATCH_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log || {
            grep -E "error:|ERROR|FAILED|What went wrong" -A3 build.log | head -30 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp app/build/outputs/apk/squatch/release/app-squatch-release.apk ../pocket-squatch.apk
          cp wear/build/outputs/apk/release/wear-release.apk ../pocket-squatch-watch.apk
          cp app/build/outputs/bundle/squatchRelease/app-squatch-release.aab ../pocket-squatch.aab
          cp wear/build/outputs/bundle/release/wear-release.aab ../pocket-squatch-watch.aab
          # Pocket Pony, the Google Play edition (the "pony" flavor)
          cp app/build/outputs/apk/pony/release/app-pony-release.apk ../pocket-pony.apk
          cp app/build/outputs/bundle/ponyRelease/app-pony-release.aab ../pocket-pony.aab

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-squatch-apk
          path: |
            pocket-squatch.apk
            pocket-squatch-watch.apk
            pocket-squatch.aab
            pocket-squatch-watch.aab
            pocket-pony.apk
            pocket-pony.aab

      - name: Publish to the "android" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease \
            --title "Pocket Squatch for Android (latest build)" \
            --notes "The newest Android build from main. Download pocket-squatch.apk on your phone and open it to install. pocket-squatch-watch.apk is the Galaxy Watch (Wear OS) companion."
          gh release upload android pocket-squatch.apk pocket-squatch-watch.apk pocket-pony.apk --clobber
          # Google Play only takes bundles signed with the release key, so unsigned ones stay out.
          if [ -n "$SQUATCH_KEYSTORE" ]; then
            gh release upload android pocket-squatch.aab pocket-squatch-watch.aab pocket-pony.aab --clobber
          fi

      # Google Play's internal testing: testers' phones and watches update on their own.
      # The phone app and the watch app have tracks of their own ("wear:" is the watch's).
      # Until the app's first release has been rolled out by hand in the Play Console, Play only
      # takes drafts: set the repository variable PLAY_RELEASE_STATUS to "draft" until then.
      - name: Send the phone app to Google Play (internal testing)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ceruleanscarab.pocketsquatch
          releaseFiles: pocket-squatch.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Send the watch app to Google Play (Wear OS internal testing)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ceruleanscarab.pocketsquatch
          releaseFiles: pocket-squatch-watch.aab
          track: wear:internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      # Pocket Pony on Google Play. Off until its listing exists in the Play Console and the
      # repository variable PONY_PLAY_TRACK names a track (internal, alpha for closed testing, ...).
      - name: Send Pocket Pony to Google Play
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.PLAY_JSON != '' && vars.PONY_PLAY_TRACK != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.bluebeetle.pocketpony
          releaseFiles: pocket-pony.aab
          track: ${{ vars.PONY_PLAY_TRACK }}
          status: ${{ vars.PONY_RELEASE_STATUS || 'draft' }}
