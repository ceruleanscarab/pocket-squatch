name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Tests
        run: |
          ./build/squatch-tests
          ./build/squatch-scene-tests

      - name: Scene screenshot
        run: ./build/squatch-pc --new --save /tmp/ci.sav --shot scene.bmp

      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: scene.bmp

      - name: Balance report
        run: |
          ./build/squatch-harness --runs 50 | tee balance.txt
          {
            echo '### Adult forms by player (50 pets each)'
            echo '```'
            cat balance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (4" LCD board)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          set -o pipefail
          idf.py -C firmware build 2>&1 | tee lcd4b.log || {
            grep -E "error:|Error|undefined reference" lcd4b.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build firmware (1.8" AMOLED board)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          set -o pipefail
          out="$PWD/firmware/build-amoled18"
          mkdir -p "$out"
          idf.py -C firmware -B "$out" -D SDKCONFIG="$out/sdkconfig" \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.amoled18" build 2>&1 | tee amoled18.log || {
            # Surface compiler errors as annotations, so they show without opening the log.
            grep -E "error:|Error|undefined reference" amoled18.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
