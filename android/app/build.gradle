apply plugin: 'com.android.application'

android {
    namespace "com.ceruleanscarab.pocketsquatch"
    compileSdkVersion 36
    // Use the NDK the build machine already has (GitHub's runners set this), else AGP's default.
    def ndkHome = System.getenv("ANDROID_NDK_LATEST_HOME")
    if (ndkHome) {  // and tell AGP which version that is, or it refuses a mismatch
        ndkPath = ndkHome
        def ndkProps = new Properties()
        file("${ndkHome}/source.properties").withInputStream { ndkProps.load(it) }
        ndkVersion = ndkProps.getProperty("Pkg.Revision")
    }
    defaultConfig {
        applicationId "com.ceruleanscarab.pocketsquatch"
        minSdkVersion 24  // Android 7; Play's automatic protection needs at least this
        targetSdkVersion 36  // what Google Play asks of new apps
        // CI sets these from the run number, so each build installs over the last. The phone and the
        // watch builds share one Play listing, which needs a different number for each: phone even, watch odd.
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger() * 10
        versionName = "0.1." + (System.getenv("VERSION_CODE") ?: "0")
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DSDL_STATIC=OFF", "-DSDL_SHARED=ON"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    // Every build must be signed with the same key, or Android won't install it over the
    // last one (and the pet's save would go with the uninstall). CI passes the key in.
    signingConfigs {
        release {
            def ks = System.getenv("SQUATCH_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("SQUATCH_KEYSTORE_PASSWORD")
                keyAlias "squatch"
                keyPassword System.getenv("SQUATCH_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig = System.getenv("SQUATCH_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // The Wear OS Data Layer, for the Galaxy Watch companion (../wear).
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
}
