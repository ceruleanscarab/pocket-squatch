apply plugin: 'com.android.application'

// The Galaxy Watch (Wear OS) companion. Same application id and signing key as the phone app:
// that's how the Wear OS Data Layer knows the two belong together.
android {
    namespace "com.ceruleanscarab.pocketsquatch.wear"
    compileSdkVersion 34
    if (System.getenv("ANDROID_NDK_LATEST_HOME")) ndkPath = System.getenv("ANDROID_NDK_LATEST_HOME")
    defaultConfig {
        applicationId "com.ceruleanscarab.pocketsquatch"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = "0.1." + (System.getenv("VERSION_CODE") ?: "0")
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    signingConfigs {
        release {
            def ks = System.getenv("SQUATCH_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("SQUATCH_KEYSTORE_PASSWORD")
                keyAlias "squatch"
                keyPassword System.getenv("SQUATCH_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig = System.getenv("SQUATCH_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear.tiles:tiles:1.4.0'
    implementation 'androidx.wear.protolayout:protolayout:1.2.0'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation 'androidx.core:core:1.12.0'
}
